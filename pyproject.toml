[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "changri-bot"
description = "长日bot：QQ 官方机器人 + 设置平台 + 网页小手机"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "nonebot2[fastapi,httpx,websockets]==2.5.0",
    "nonebot-adapter-qq==1.7.1",
    "nonebot-plugin-apscheduler==0.5.0",
    "Flask>=3.0,<4",
    "python-dotenv==1.2.2",
    "a2wsgi==1.10.10",
    "pillow==13.0.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pyflakes"]          # 只在开发机上装：pip install -e ".[dev]"

[project.scripts]
changri = "changri.__main__:main"

[tool.setuptools.dynamic]
version = { file = "src/changri/VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["changri_api"]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
changri = ["**/*.html", "**/*.css", "**/*.js", "**/*.png", "**/*.svg", "**/*.ico", "**/*.webp", "**/*.json", "**/*.txt", "**/*.otf", "**/*.md", "**/*.sql"]
