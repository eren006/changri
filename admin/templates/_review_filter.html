<form method="get" class="inline" style="margin:0 0 14px">
  <label>这个人参与的 <input type="text" name="role" value="{{ f.role }}" list="rn" size="10" placeholder="全部人"></label>
  <datalist id="rn">{% for n in names %}<option value="{{ n }}">{% endfor %}</datalist>
  <label>类型 <select name="kind"><option value="">全部</option>{% for k, v in [('room','房间（私约/电话…）'),('sms','短信'),('gift','礼物')] %}<option value="{{ k }}" {{ 'selected' if f.kind == k }}>{{ v }}</option>{% endfor %}</select></label>
  <label>内容里有 <input type="text" name="q" value="{{ f.q }}" size="12" placeholder="关键词"></label>
  <button class="btn">筛选</button>
  {% if f.role or f.kind or f.q %}<a class="btn ghost" href="{{ request.path }}">清除</a>{% endif %}
</form>
