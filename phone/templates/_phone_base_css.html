<style>
:root {
  --page: #d9d9e0;
  --bg: #ffffff;
  --bar: rgba(247,247,250,.92);
  --line: #e3e3e8;
  --text: #111114;
  --muted: #65656e;
  --mine: #6854bc;
  --mine-text: #ffffff;
  --theirs: #f0eff2;
  --theirs-text: #111114;
  --gift-bg: #faf5e9;
  --gift-line: #e8dcc0;
  --gift-text: #5b4410;
  --tag: #b4552f;
  --link: #62616a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0b0b0e;
    --bg: #000000;
    --bar: rgba(22,22,26,.92);
    --line: #26262c;
    --text: #f2f2f5;
    --muted: #a0a0aa;
    --mine: #6854bc;
    --theirs: #25252b;
    --theirs-text: #f2f2f5;
    --gift-bg: #29261e;
    --gift-line: #494132;
    --gift-text: #e2d3b3;
    --tag: #f0936b;
    --link: #aaa8b1;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--page); color: var(--text);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 16px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--link); text-decoration: none; }

/* 手机上铺满；桌面上居中一台"手机" */
.phone {
  background: var(--bg); min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; max-width: 480px; margin: 0 auto;
}
@media (min-width: 600px) {
  body { padding: 28px 0; }
  .phone {
    min-height: 0; height: calc(100vh - 56px); max-width: 400px;
    border-radius: 36px; overflow: hidden;
    box-shadow: 0 0 0 10px #1c1c1f, 0 20px 60px rgba(0,0,0,.35);
  }
}

.bar {
  position: sticky; top: 0; z-index: 5;
  background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--line);
  padding: env(safe-area-inset-top) 8px 8px;
  /* 二级页导航栏：左右两栏等宽，标题真正居中；左右按钮都固定在第一行 44px 里、跟标题文字同一条线，
     副标题（small）和次数行排在下面，不会把两边的按钮挤得上下错位 */
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto) minmax(0, 1fr); column-gap: 6px; align-items: start;
}
.bar:not(.tab-bar) > :first-child, .bar:not(.tab-bar) > .right { grid-row: 1; height: 44px; display: flex; align-items: center; min-width: 0; }
.bar:not(.tab-bar) > :first-child { justify-self: start; }
.bar .back, .bar .linkbtn { font-size: 16px; line-height: 1; color: var(--link); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
.bar .back::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-1px) rotate(45deg); }
.bar .title { grid-row: 1; grid-column: 2; text-align: center; font-weight: 600; font-size: 17px; line-height: 22px; padding-top: 11px;
              max-width: 62vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .title:has(.avatar.head) { padding-top: 7px; }
.bar .title small { display: block; font-weight: 400; font-size: 12px; line-height: 16px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.bar .right { grid-column: 3; justify-self: end; font-size: 16px; }
.bar.big { display: block; padding-bottom: 12px; }
.bar.big h1 { font-size: 30px; font-weight: 700; letter-spacing: -.5px; margin-top: 6px; }
.bar.big .sub { font-size: 13px; color: var(--muted); }

.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

.avatar { position: relative;
  width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 600; font-size: 17px;
}
.avatar.sm { width: 30px; height: 30px; font-size: 13px; }

.list a.row {
  display: flex; gap: 12px; align-items: center; padding: 14px 18px; color: var(--text);
}
.list a.row:active { background: var(--theirs); }
.row .body { flex: 1; min-width: 0; border-bottom: .5px solid var(--line); padding-bottom: 10px; margin-bottom: -10px; }
.row:last-child .body { border-bottom: none; }
.row .top { display: flex; justify-content: space-between; gap: 8px; }
.row .name { min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .time { color: var(--muted); font-size: 11px; flex-shrink: 0; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .time::after { content: " ›"; }
.row .preview {
  color: var(--link); font-size: 13px; line-height: 1.5; height: 39px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.row.unread .avatar::after,.disc-group .row.unread .app-icon::after { content: ""; position: absolute; right: -1px; top: 0; width: 8px; height: 8px; border-radius: 50%; background: #69758b; box-shadow: 0 0 0 3px var(--bg); }
.row .meta { color: var(--muted); font-size: 14px; }

.empty { color: var(--muted); text-align: center; padding: 60px 24px; font-size: 14px; }

/* 聊天气泡 */
.new-message-anchor { position: sticky; bottom: 160px; height: 0; z-index: 6; text-align: center; }
.new-message { transform: translateY(-100%); padding: 8px 16px; border: 1px solid var(--line); border-radius: 24px; background: var(--bg); color: var(--text); box-shadow: 0 3px 14px #00000012; font: inherit; font-size: 13px; cursor: pointer; }
#scroll { display: flex; flex-direction: column; }
#scroll .chat { margin-top: auto; flex-shrink: 0; width: 100%; }
@media (min-width: 600px) { #scroll { min-height: 0; } }
.chat { padding: 8px 12px 24px; display: flex; flex-direction: column; }
.stamp { opacity: .82; text-align: center; color: var(--muted); font-size: 12px; margin: 16px 0 6px; }
.stamp b { font-weight: 600; }
.msg { display: flex; flex-direction: column; max-width: 78%; margin-top: 3px; }
.msg.mine { align-self: flex-end; align-items: flex-end; }
.msg.theirs { align-self: flex-start; align-items: flex-start; }
/* 气泡旁的头像：头像占一列，其余内容都在另一列；有署名时头像跟气泡对齐而不是跟署名 */
#scroll .msg { display: grid; column-gap: 8px; max-width: 86%; }
#scroll .msg.theirs { grid-template-columns: 32px minmax(0, auto); justify-items: start; }
#scroll .msg.mine { grid-template-columns: minmax(0, auto) 32px; justify-items: end; }
#scroll .msg.theirs > * { grid-column: 2; }
#scroll .msg.mine > * { grid-column: 1; }
#scroll .msg.theirs > .bav { grid-column: 1; }
#scroll .msg.mine > .bav { grid-column: 2; }
#scroll .msg > .sig ~ .bav { grid-row: 2; }
#scroll .msg > .bav:not(.sig ~ .bav) { grid-row: 1; }
.bav { width: 32px; height: 32px; font-size: 13px; align-self: start; }
.bubble {
  font-size: var(--reading-size, 16px); line-height: 1.6;
  padding: 8px 13px; border-radius: 19px; white-space: pre-wrap; word-break: break-word;
}
.mine .bubble { background: var(--mine); color: var(--mine-text); border-bottom-right-radius: 5px; }
.theirs .bubble { background: var(--theirs); color: var(--theirs-text); border-bottom-left-radius: 5px; }
/* 浅色模式：卡片和气泡去掉硬边线，改成带主题色的柔和光晕；深色模式光晕看不出来，保留细边 */
@media (prefers-color-scheme: light) {
  .phone[data-wall="paper"] .theirs .bubble, .phone[data-wall="mist"] .theirs .bubble, .phone[data-wall="sage"] .theirs .bubble, .phone[data-wall="rose"] .theirs .bubble, .phone[data-wall="eye"] .theirs .bubble, .phone[data-wall="lilac"] .theirs .bubble { background: #fff; border: 0; box-shadow: 0 1px 2px rgba(20,20,40,.05), 0 3px 12px color-mix(in srgb, var(--mine) 13%, transparent); }
  .list .disc-group, .pf-card, .pf-group, .gm-card, .gm-rank, .ch-list, .ch-cur div { border-color: transparent !important; box-shadow: 0 1px 2px rgba(20,20,40,.04), 0 6px 20px color-mix(in srgb, var(--mine) 11%, transparent); }
}
.sig { opacity: .82; font-size: 12px; color: var(--muted); margin: 6px 0 2px 12px; }
.gift {
  border: 1px solid var(--gift-line); background: var(--gift-bg); color: var(--gift-text);
  border-radius: 16px; padding: 16px 18px; min-width: 160px; max-width: 100%;
}
.gift .gname { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.gift .gname::before { content: "礼物 · "; }
.gift .gnote { font-size: calc(var(--reading-size, 16px) - 2px); margin-top: 10px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
.tag { font-size: 12px; color: var(--muted); margin-top: 3px; padding: 0 4px; }

.linkbtn { background: none; border: none; color: var(--link); font: inherit; font-size: 16px; cursor: pointer; padding: 0; text-align: left; }

/* 激活码输入 */
.entry { padding: 24px 20px; display: flex; flex-direction: column; gap: 12px; }
.entry input {
  font: inherit; font-size: 20px; letter-spacing: 3px; text-align: center; text-transform: uppercase;
  padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--theirs); color: var(--text);
}
.entry input:focus { outline: 2px solid var(--mine); outline-offset: 1px; }
.entry button {
  font: inherit; font-weight: 600; padding: 12px; border: none; border-radius: 12px;
  background: var(--mine); color: var(--mine-text); cursor: pointer;
}
.entry .err { color: var(--tag); font-size: 14px; text-align: center; }
.entry .hint { color: var(--muted); font-size: 13px; text-align: center; }

/* 次数条 / 回执 / 输入栏 */
.quota { grid-column: 1 / -1; text-align: center; font-size: 11px; font-weight: 400; color: var(--muted); padding-top: 4px; }
.quota .near-limit { color: var(--tag); font-weight: 600; }
.notice {
  align-self: center; max-width: 88%; margin: 14px 0 4px; padding: 6px 12px; border-radius: 12px;
  background: var(--theirs); color: var(--muted); font-size: 13px; text-align: center; white-space: pre-wrap;
}
.compose {
  position: sticky; bottom: 0; z-index: 5; display: flex; align-items: flex-end; gap: 6px; flex-wrap: wrap;
  padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px);
  background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--line);
}
.compose textarea {
  flex: 1; min-width: 0; min-height: 40px; resize: none; font: inherit; font-size: 16px; line-height: 1.35; max-height: 140px;
  padding: 9px 14px; border-radius: 20px; box-sizing: border-box; border: 1px solid var(--line); background: var(--bg); color: var(--text);
  overflow-y: hidden;
}
.compose textarea:focus { outline: none; border-color: var(--mine); }
.compose.gift-mode textarea { border-color: var(--gift-line); background: var(--gift-bg); color: var(--gift-text); }
/* 图鉴选择 */
.gift-row { display: none; order: -1; flex-basis: 100%; gap: 6px; align-items: center; }
.compose.gift-mode .gift-row { display: flex; }
.gift-row .gift-name { flex: 1; }
.preset-open, .preset-clear { flex-shrink: 0; height: 38px; border-radius: 19px; border: 1px solid var(--gift-line); background: var(--gift-bg);
  color: var(--gift-text); font: inherit; font-size: 13px; padding: 0 12px; cursor: pointer; }
.preset-clear { width: 38px; padding: 0; font-size: 16px; }
.preset-panel { flex-direction: column; flex-wrap: nowrap; }
.preset-item { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; white-space: normal !important;
  border-radius: 12px !important; background: var(--gift-bg) !important; color: var(--gift-text) !important; border-color: var(--gift-line) !important; }
.preset-item span { font-size: 12.5px; opacity: .8; }
.preset-empty { font-size: 13px; color: var(--muted); padding: 6px 4px; }
.compose textarea:disabled { opacity: .55; }
/* 礼物模式多一栏「礼物」（名字），留言仍在下面的输入框里 */
.compose .gift-name {
  display: none; order: -1; flex-basis: 100%; min-width: 0; height: 38px; font: inherit; font-size: 16px;
  padding: 0 14px; border-radius: 19px; border: 1px solid var(--gift-line); background: var(--gift-bg); color: var(--gift-text);
}
.compose .gift-name:focus { outline: none; border-color: var(--gift-text); }
.compose.gift-mode .gift-name { display: block; }
.gift-row .gift-name { order: 0; flex-basis: auto; }
.compose .icon {
  flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
  font-size: 18px; line-height: 40px; text-align: center; padding: 0; display: inline-flex; align-items: center; justify-content: center;
}
.compose .gift-toggle { background: var(--theirs); filter: grayscale(1); opacity: .7; }
.compose.gift-mode .gift-toggle { background: var(--gift-bg); filter: none; opacity: 1; box-shadow: 0 0 0 1px var(--gift-line); }
.compose .send { background: var(--mine); color: var(--mine-text); transition: background .15s, color .15s, transform .1s; }
.compose .send:active:not(:disabled) { transform: scale(.94); }
.compose .send:disabled { background: var(--theirs); color: var(--muted); opacity: 1; cursor: default; }
.compose .send svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.compose .input-wrap { position: relative; flex: 1; min-width: 0; display: flex; }
.compose .input-wrap textarea { width: 100%; min-height: 44px; padding-right: 50px; }
.compose .emoji-in { position: absolute; right: 1px; bottom: 0; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.compose .emoji-in svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.compose .emoji-in[aria-expanded="true"] { background: var(--theirs); color: var(--text); }
.stickers {
  position: absolute; bottom: 100%; left: 0; right: 0; z-index: 5; max-height: 42vh; overflow-y: auto;
  padding: 10px 10px 6px; background: var(--bar); border-top: .5px solid var(--line);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  display: flex; flex-wrap: wrap; gap: 6px;
}
.stickers[hidden] { display: none; }
.stickers button {
  font: inherit; font-size: 15px; line-height: 1.3; padding: 6px 10px; border-radius: 14px; cursor: pointer;
  border: .5px solid var(--line); background: var(--bg); color: var(--text); white-space: nowrap;
}
.stickers button.emoji { font-size: 22px; padding: 4px 6px; border-color: transparent; background: none; }
.stickers button:active { background: var(--theirs); }
.avatar.song-avatar { background: linear-gradient(135deg, #f58ab0, #8b7cf6) !important; filter: none; font-size: 20px; color: #fff; }
.avatar.gnotice-avatar { background: linear-gradient(135deg, #2f7d6d, #5b8def) !important; filter: none; font-size: 20px; color: #fff; }
.avatar.steal-avatar { background: linear-gradient(135deg, #3d3b47, #8c4a3a) !important; filter: none; font-size: 20px; color: #fff; }
.steal-card { margin: 12px 16px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--theirs); color: var(--text); }
.steal-card h3 { font-size: 15px; margin-bottom: 4px; }
.steal-card p { font-size: 12.5px; color: var(--muted); margin: 4px 0 10px; }
.steal-card form { display: flex; gap: 8px; align-items: center; }
.steal-card select { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.steal-card button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--mine); color: var(--mine-text); font: inherit; font-size: 14px; cursor: pointer; }
.steal-card button:disabled { opacity: .5; cursor: default; }
.admin-shop .steal-card form.steal-cfg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
.admin-shop .steal-cfg label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
.admin-shop .steal-cfg input { font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); width: 100%; }
.admin-shop .steal-cfg button { grid-column: 1 / -1; }
.steal-row { display: flex; flex-wrap: wrap; gap: 4px 8px; padding: 8px 0; border-top: .5px solid var(--line); font-size: 13.5px; }
.steal-row span { margin-left: auto; color: var(--muted); font-size: 12px; }
.ro-banner { flex: none; box-sizing: border-box; width: 100%; padding: 4px 12px; background: #2b2b33; color: #f4f1e6; font-size: 11.5px; line-height: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.ro-banner .ro-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ro-banner a, .ro-banner button { flex: none; color: #f4f1e6; font: inherit; line-height: 20px; padding: 0 8px; border: 1px solid rgba(244,241,230,.45); border-radius: 10px; background: none; text-decoration: none; cursor: pointer; }
.ro-banner form { display: contents; }
.phone[data-ro] .phone-nav { grid-template-columns: repeat(4, 1fr); }   /* 中间的「＋」收起后，亲友底栏是 信息/发现/桌面/外观 4 个，别留一个空格 */
.phone[data-ro] #bgmBtn { top: 34px !important; }   /* 条幅 28px 高，音乐按钮往下让开 */
@media (min-width: 600px) { .phone[data-ro] #bgmBtn { top: 62px !important; } }   /* 桌面上手机框距页面顶 28px */
.phone[data-ro] :is(a.dock-plus, a[href$="/p/me/new"], .tab-actions a[href$="/p/me/new"]) { display: none !important; }
.steal-flash { margin: 12px 16px 0; padding: 10px 14px; border-radius: 12px; background: var(--theirs); color: var(--text); font-size: 14px; border: 1px solid var(--line); }
.public-avatar { background: var(--theirs) !important; font-size: 19px; filter: grayscale(.7); }
.public-row { border-bottom: 6px solid var(--theirs); }
#scroll .public-feed { margin-top: 0; padding: 12px 16px 32px; gap: 10px; }
.public-new { bottom: calc(var(--dock-height, 61px) + 12px); }
.broadcast {
  align-self: stretch; padding: 16px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text);
}
.bc-head { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; overflow-wrap: anywhere; }
.bc-time { margin-left: auto; white-space: nowrap; font-size: 11px; }
.bc-gift { font-weight: 600; margin-top: 4px; }
.bc-text { font-size: var(--reading-size, 16px); line-height: 1.75; margin-top: 10px; white-space: pre-wrap; word-break: break-word; }
.remaining { order: -1; flex-basis: 100%; text-align: right; padding-right: 44px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.compose-note { text-align: center; font-size: 12px; color: var(--muted); padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px); border-top: .5px solid var(--line); }

/* 本机外观：背景跟随系统明暗，主题色均满足白字 AA 对比度。 */
.phone { --wall-paper: #f2eadb; --wall-mist: #e4edf5; --wall-sage: #e5efe7; --wall-rose: #f5e3e9; --wall-eye: #cce8cf; --wall-lilac: #e9e4f4; --chat-bg: var(--bg); }
.phone[data-wall="paper"] { --chat-bg: var(--wall-paper); }
.phone[data-wall="mist"] { --chat-bg: var(--wall-mist); }
.phone[data-wall="sage"] { --chat-bg: var(--wall-sage); }
.phone[data-wall="rose"] { --chat-bg: var(--wall-rose); }
.phone[data-wall="eye"] { --chat-bg: var(--wall-eye); }
.phone[data-wall="lilac"] { --chat-bg: var(--wall-lilac); }
/* 非默认底色：卡片、输入框、对方气泡都跟着底色走（本季配色的米色会跟别的底色打架）。
   卡片比底色更浅（掺白）、对方气泡/填充比底色略深，三层有明显层次；底色越饱和掺的白越多。 */
.phone[data-wall]:not([data-wall="default"]) { --card-white: 62%; }
.phone:is([data-wall="eye"], [data-wall="lilac"]) { --card-white: 50%; }
.phone[data-wall]:not([data-wall="default"]) { --bg: color-mix(in srgb, #fff var(--card-white), var(--chat-bg)); --theirs: color-mix(in srgb, var(--chat-bg) 82%, var(--text) 8%); }
@media (prefers-color-scheme: dark) {
  .phone[data-wall]:not([data-wall="default"]) { --bg: color-mix(in srgb, var(--chat-bg) 91%, #fff); --theirs: color-mix(in srgb, var(--chat-bg) 82%, #fff); }
}
/* 美第奇的卡片/气泡本来就是「比底色更浅的纸」（用的是 --theirs），所以这里让 --theirs 跟卡片同色，别再用上面那个偏深的填充色 */

/* ── 顶部与间距（统一一套）──────────────────────────────────────────────────────────

   高度按 4 的倍数：标题行 48、按钮 40、卡片内边距 14。放在样式末尾，同优先级下覆盖前面零散的数值。 */
:root { --gutter: 18px; --gap: 12px; }
.bar { padding-left: 10px; padding-right: 10px; }

.tab-head { min-height: 48px; }

/* 所有头部统一成大标题款：第一行 44px 放返回键/按钮（信息页放次数），第二行左对齐大标题，高度一致 */

  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: 44px auto; column-gap: 8px; align-items: center;
  padding: calc(env(safe-area-inset-top) + 10px) var(--gutter, 18px) 10px; min-height: calc(env(safe-area-inset-top) + 104px); box-sizing: border-box;

.bar:not(.big):not(.tab-bar) > :first-child { grid-row: 1; grid-column: 1; height: 44px; justify-self: start; padding: 0; margin-left: 0; }
.bar:not(.big):not(.tab-bar) > .right { grid-row: 1; grid-column: 2; height: 44px; justify-self: end; gap: 8px; }
.bar:not(.big):not(.tab-bar) .title { grid-row: 2; grid-column: 1 / -1; align-self: start; max-width: none; text-align: left; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -.5px; padding: 0; display: flex; align-items: center; gap: 10px; min-width: 0; }
.bar:not(.big):not(.tab-bar) .title:has(.avatar.head) { padding-top: 0; }
.bar .title small { display: none; }
.bar:not(.big):not(.tab-bar) .back::before { margin-left: 3px; }
.bar:not(.big):not(.tab-bar) > .quota { grid-row: 1; grid-column: 1; justify-self: end; height: 44px; display: flex; align-items: center; margin: 0; padding: 0 0 0 52px; gap: .3em; white-space: nowrap; font-size: 12px; line-height: 16px; text-align: right; color: var(--muted); }
/* 对话页额度放在名字下面一行，不跟右上角的按钮挤在一起 */
.bar:not(.big):not(.tab-bar) > .quota { grid-row: 3; grid-column: 1 / -1; justify-self: start; height: auto; padding: 4px 2px 0; }
.bar:not(.big):not(.tab-bar) .title .avatar.head { margin: 0; flex: none; width: 34px; height: 34px; font-size: 15px; }
.bar.tab-bar:not(.big) .tab-head { display: contents; }
.bar.tab-bar:not(.big) .tab-head h1 { grid-row: 2; grid-column: 1 / -1; align-self: start; margin: 0; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -.5px; text-align: left; max-width: none; padding: 0; }
.bar.tab-bar:not(.big) .tab-actions { grid-row: 1; grid-column: 2; justify-self: end; height: 44px; gap: 4px; }
.bar.tab-bar:not(.big) .tab-sub { display: none; }
.bar.tab-bar:not(.big) .tab-sub.keep { display: flex; grid-row: 1; grid-column: 1; height: 44px; align-items: center; margin: 0; padding: 0; font-size: 13px; line-height: 18px; }
.bar.tab-bar:not(.big) .tab-sub.keep .quota { font-size: 13px; }
.bar.tab-bar:not(.big) .tab-sub.keep .quota::before { content: ""; }
.pause-banner { flex: none; padding: calc(env(safe-area-inset-top) + 8px) 16px 8px; background: #f3e3c5; color: #5b4410; font-size: 13px; line-height: 1.5; text-align: center; }
@media (prefers-color-scheme: dark) { .pause-banner { background: #3a3222; color: #e2d3b3; } }
.lm-note { padding: 8px var(--gutter, 18px) 0; font-size: 12px; color: var(--muted); }
.icon-btn { width: 40px; height: 40px; }
.icon-btn svg { width: 20px; height: 20px; }
.song-tabs { padding: var(--gap) var(--gutter) 0; }
.lm-letter { margin: 10px var(--gutter); }
.lm-sub small { font-size: 13px; }

/* 首页：标题 → 搜索行 → 待回卡片，每层之间 14px 留白，不再叠一排按钮 */
.find-row { display: flex; align-items: center; gap: 10px; margin: 14px var(--gutter) 14px; }
.search-pill { display: flex; align-items: center; flex: 1; min-width: 0; margin: 0; gap: 8px; height: 42px; padding: 0 14px; border-radius: 12px; font-size: 15px; background: var(--theirs); color: var(--muted); text-decoration: none; }
.search-pill svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; flex-shrink: 0; }
.timeline-btn { position: relative; flex-shrink: 0; width: 42px; height: 42px; border-radius: 12px; background: var(--theirs); color: var(--text); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.timeline-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.timeline-btn b { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--mine); color: var(--mine-text); font-size: 11px; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px var(--bg); }
.search-pill:active, .timeline-btn:active { filter: brightness(.96); }

/* 列表：用细线和一小段留白分组，不再用整条灰带 */
.public-row { border-bottom: 0; }
.list a.row { padding: 16px var(--gutter); }
.notice.inbox-flash { margin: var(--gap) var(--gutter) 0; }

/* 首页全局搜索：输入框就是搜索条；有输入时列表换成分组结果 */
.search-pill input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: var(--text); padding: 0; }
.search-pill input::placeholder { color: var(--muted); }
.search-pill input::-webkit-search-cancel-button { display: none; }
.search-pill:focus-within { box-shadow: 0 0 0 2px var(--mine); }
.search-clear { border: 0; background: none; padding: 0; width: 22px; height: 22px; color: var(--muted); cursor: pointer; display: inline-flex; flex-shrink: 0; }
.search-clear svg { width: 22px; height: 22px; }
.search-clear[hidden] { display: none; }
#inbox.searching > :not(.find-row):not(.search-results) { display: none !important; }
.search-results { padding-bottom: 24px; }
.search-group { margin-top: 4px; }
.search-group h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px var(--gutter) 4px; }
.search-item { display: block; padding: 12px var(--gutter); color: var(--text); text-decoration: none; border-bottom: .5px solid var(--line); }
.search-item:active { background: var(--theirs); }
.search-item .si-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.search-item .si-title { font-weight: 600; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-item .si-meta { font-size: 12px; color: var(--muted); flex-shrink: 0; max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-item .si-body { font-size: 14px; color: var(--muted); margin-top: 3px; line-height: 1.5; word-break: break-word; }
.search-item mark { background: color-mix(in srgb, var(--mine) 22%, transparent); color: var(--text); border-radius: 3px; padding: 0 1px; }
.search-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 48px var(--gutter); }

/* 时间线与统计的标签：分段控件——整排坐在一条浅灰底槽里，当前项是浮起的白色块，其余项没有底 */
.stats-page .stats-tabs { position: sticky; top: 0; z-index: 2; display: flex; gap: 2px; margin: 12px var(--gutter) 6px; padding: 3px; border: 0; border-radius: 12px; background: var(--theirs); backdrop-filter: none; }
.stats-page .stats-tabs a { flex: 1; min-height: 34px; padding: 0 2px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 14px; box-shadow: none; }
.stats-page .stats-tabs a[aria-current] { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.stats-page .stats-tabs a:not([aria-current]):active { background: color-mix(in srgb, var(--bg) 50%, transparent); }

/* 待回：分组列表，一项一行半，按钮在右边 */
.pending-list { list-style: none; margin: 12px var(--gutter) 12px; padding: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--bg); }
.pending-row { display: flex; align-items: center; gap: 10px; padding: 10px 6px 10px 14px; border-top: .5px solid var(--line); }
.pending-row:first-child { border-top: 0; }
.pending-row.is-muted { opacity: .7; }
.pending-body { flex: 1; min-width: 0; }
.pending-line1 { display: flex; align-items: baseline; gap: 8px; line-height: 22px; }
.pending-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pending-chip { flex-shrink: 0; font-size: 12px; line-height: 20px; padding: 0 7px; border-radius: 10px; background: var(--theirs); color: var(--muted); font-variant-numeric: tabular-nums; }
.pending-chip.is-due { background: #fff0eb; color: #9b3520; font-weight: 600; }
.pending-line2 { margin-top: 1px; font-size: 13px; line-height: 20px; color: var(--muted); overflow-wrap: anywhere; }
.pending-mute { margin: 0; flex-shrink: 0; }
.pending-mute .quiet-button { padding: 0 8px; min-height: 40px; font-size: 13px; color: var(--muted); }
.pending-muted { margin: 4px 0 12px; }
.pending-muted .pending-list { margin-top: 8px; }
.pending-muted summary { margin: 0 var(--gutter); font-size: 13px; color: var(--muted); cursor: pointer; }
@media (prefers-color-scheme: dark) { .pending-chip.is-due { background: #351f20; color: #ffb4a0; } }

/* 微信名设置（「我的」页） */
.nick-form { margin: 14px var(--gutter) 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
.nick-form label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.nick-row { display: flex; gap: 8px; align-items: center; }
.nick-row input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 16px; }
.nick-row .quiet-button { min-height: 40px; padding: 0 10px; font-size: 15px; font-weight: 600; }
.nick-hint { margin: 8px 0 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
.profile-flash { margin: 10px var(--gutter) 0; }

/* 管理桌面：沿用六套主题的语义颜色。 */
.admin-desktop { padding: 14px 20px 100px; }
.phone .admin-desktop .plugin-chip,.phone .admin-urge .plugin-chip { color: var(--text); }
.admin-desktop .plugin-chip { display: block; margin: 0; overflow-wrap: anywhere; }
.admin-welcome { margin: 26px 4px 28px; }
.admin-welcome > span { color: var(--muted); font-size: 12px; letter-spacing: .16em; }
.admin-welcome h1 { margin: 8px 0; font-size: 23px; font-weight: 600; }
.admin-welcome p,.urge-summary p { color: var(--muted); font-size: 12px; }
.admin-apps { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 28px 8px; }
.admin-app { display: flex; align-items: center; flex-direction: column; gap: 10px; color: var(--text); font-size: 12px; text-align: center; }
.app-icon { display: flex; position: relative; flex: 0 0 auto; align-items: center; justify-content: center; width: 66px; height: 66px; border-radius: 20px; color: color-mix(in srgb,var(--mine) 65%,var(--text)); background: color-mix(in srgb,var(--mine) 9%,var(--bg)); border: 1px solid color-mix(in srgb,var(--mine) 22%,var(--line)); }
.app-icon svg { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.app-icon .icon-wash { fill: color-mix(in srgb,var(--mine) 12%,var(--bg)); }
.app-icon .icon-knob { fill: var(--bg); }
.app-icon-classic { border-radius: 14px 14px 23px 14px; outline: 1px solid var(--line); outline-offset: -5px; }
.app-icon-scifi { border-radius: 5px; clip-path: polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px); background: linear-gradient(135deg,var(--theirs),var(--bg)); }
.app-icon-scifi svg { stroke-linecap: square; stroke-linejoin: bevel; }
.app-icon-medieval { border-radius: 13px 13px 29px 29px; border-width: 2px; }
.app-icon-cloudpost { border-radius: 8px; border: 2px dashed color-mix(in srgb,var(--mine) 45%,var(--line)); outline: 1px solid var(--line); outline-offset: -6px; background: var(--bg); }
.app-icon-medici { border-radius: 8px; border: 1px solid var(--medici-gold, var(--line)); outline: 1px solid var(--medici-gold, var(--line)); outline-offset: -5px; background: linear-gradient(145deg,var(--theirs),var(--bg)); color: var(--mine); }
.app-icon-republic { border-radius: 10px; border: 3px double color-mix(in srgb,var(--mine) 40%,var(--line)); }
.admin-app:active .app-icon { transform: scale(.96); }
.admin-app:focus-visible,.admin-nav button:focus-visible { outline: 2px solid var(--mine); outline-offset: 4px; }
.admin-roles[hidden] { display: none; }
.admin-roles .admin-role { flex-wrap: wrap; gap: 10px; }
.admin-roles .admin-role .body { min-width: 100px; }
.bottom-dock .phone-nav.admin-nav { display: grid; grid-template-columns: 1fr 1fr; background: var(--theirs); border: 1px solid var(--line); box-shadow: none; }
.bottom-dock .admin-nav a { font-size: 11px; color: var(--muted); }
.bottom-dock .admin-nav a[aria-current] { background: var(--bg); color: var(--text); }
.admin-nav form { display: flex; }
.admin-nav button { display: flex; flex: 1; align-items: center; justify-content: center; flex-direction: column; gap: 3px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 11px; cursor: pointer; min-height: 48px; }
.admin-dock-icon { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.admin-nav a > span,.admin-nav button > span { font-size: 24px; line-height: 24px; }
.urge-summary { display: flex; align-items: center; gap: 16px; margin: 22px 18px; }
.urge-summary strong { font-size: 30px; font-weight: 600; }
.urge-summary small { font-size: 14px; font-weight: 400; }
.urge-filter { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 22px 18px 12px; font-size: 12px; }
.urge-filter > span { font-weight: 600; }
.urge-filter a { padding: 9px 12px; border: 1px solid var(--line); border-radius: 20px; color: var(--text); }
.admin-urge .ch-list { background: none; border: 0; overflow: visible; }
.admin-urge .urge-card { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 8px 12px; padding: 16px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--theirs); cursor: pointer; }
.urge-card input { width: 18px; height: 18px; accent-color: var(--mine); }
.urge-card .nm { overflow-wrap: anywhere; }
.admin-urge .urge-card .ct { grid-column: 2; justify-self: start; font-size: 12px; white-space: normal; }
.admin-urge .is-overdue { border-inline-start: 3px solid var(--mine); }
.urge-actions { display: grid; gap: 8px; margin: 18px 18px 26px; }
.urge-actions .ch-btn { margin: 0; min-height: 44px; background: var(--theirs); color: var(--text); border: 1px solid var(--line); }
.urge-actions .ch-btn + .ch-btn { background: var(--bg); color: var(--text); border: 1px solid var(--line); }

/* 漂流瓶：信笺、潮汐与匿名往来；颜色跟随当前主题。 */
.bottle-page { padding: 22px 18px 32px; }
.bottle-letter { padding: 20px; border: 1px solid var(--gift-line); border-radius: 18px 18px 5px 18px; background: var(--gift-bg); }
.bottle-letter-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.bottle-letter-head label { display: block; font-size: 16px; font-weight: 600; line-height: 1.6; }
.bottle-hint { color: var(--muted); font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; }
.bottle-letter textarea { display: block; width: 100%; min-height: 136px; padding: 10px 0; resize: vertical; border: 0; border-top: 1px solid var(--gift-line); border-bottom: 1px solid var(--gift-line); border-radius: 0; background: var(--gift-bg); color: var(--text); font: inherit; font-size: 16px; line-height: 1.9; }
.bottle-letter textarea::placeholder { color: var(--muted); opacity: 1; }
.bottle-letter-foot { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-top: 16px; }
.bottle-letter button,.phone .bottle-compose button { min-height: 44px; padding: 10px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--theirs); color: var(--text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.bottle-letter.is-disabled { opacity: .6; }
.bottle-letter :disabled,.bottle-compose :disabled { cursor: not-allowed; }
.bottle-section { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 2px 10px; }
.bottle-section h2 { font-size: 15px; font-weight: 600; }
.bottle-section span { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.bottle-entry .app-icon,.bottle-page .app-icon { width: 44px; height: 44px; border-radius: 14px; }
.bottle-entry .app-icon svg,.bottle-page .app-icon svg { width: 29px; height: 29px; }
.bottle-list { display: grid; gap: 8px; }
.bottle-row { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 12px; padding: 16px 12px; min-height: 88px; border: 1px solid var(--line); border-radius: 14px; color: var(--text); background: var(--bg); }
.bottle-row-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; font-size: 14px; }
.bottle-tag { font-size: 11px; font-weight: 400; color: var(--muted); }
.bottle-preview { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; margin: 7px 0; font-size: 13px; line-height: 1.7; }
.bottle-row time { display: block; font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.bottle-row.is-pending { border-style: dashed; background: var(--theirs); }

.bottle-row.is-failed,.bottle-alert { background: var(--gift-bg); border: 1px solid var(--gift-line); border-inline-start-width: 3px; }
.bottle-reason { margin: 6px 0; font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; }
.bottle-empty { padding: 32px 16px; text-align: center; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); font-size: 13px; line-height: 2; }
.bottle-footnote { margin: 22px 4px 0; }
.bottle-thread { padding: 22px 16px; }
.bottle-thread .msg { margin: 0 0 20px; }
.phone .bottle-thread .bubble { padding: 13px 16px; border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; background: var(--theirs); color: var(--text); line-height: 1.8; overflow-wrap: anywhere; }
.phone .bottle-thread .mine .bubble { border-color: var(--gift-line); border-radius: 16px 16px 4px 16px; background: var(--gift-bg); }
.phone .bottle-thread .is-pending .bubble { border-style: dashed; }
.bottle-thread .meta { color: var(--muted); font-size: 11px; margin-top: 6px; }
.bottle-alert { margin: 0 0 18px; padding: 12px 14px; border-radius: 10px; color: var(--text); font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; }
.phone .bottle-compose { padding: 12px 14px calc(env(safe-area-inset-bottom) + 12px); gap: 10px; }
.phone .bottle-compose textarea { min-height: 44px; border-radius: 12px; overflow-y: auto; }
.bottle-admin-intro { padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.bottle-admin-intro p { margin-top: 10px; }
.bottle-admin-card { border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; padding: 16px; }
.bottle-admin-card h2 { font-size: 14px; font-weight: 600; line-height: 1.8; overflow-wrap: anywhere; }
.bottle-admin-message { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; }
.bottle-admin-message p { white-space: pre-wrap; }
.bottle-admin-message.is-hidden { border-top-style: dashed; }
.bottle-hidden { display: inline-block; color: var(--muted); font-size: 12px; }
.bottle-bar .back { min-width: 44px; }
.phone .bar.bottle-bar .title { display: block; }
.bottle-bar .title small { display: block; margin-top: 5px; white-space: normal; letter-spacing: 0; line-height: 1.7; }
.bottle-page :focus-visible,.phone .bottle-compose textarea:focus-visible,.bottle-compose :focus-visible,.bottle-bar a:focus-visible,.bottle-entry:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
/* 心愿：匿名许愿签，样式仅作用于心愿页与入口。 */
.wish-page { padding: 22px 18px 32px; }
.phone .bar.wish-bar .title { display: block; }
.wish-bar .title small { display: block; margin-top: 5px; line-height: 1.7; white-space: normal; letter-spacing: 0; }
.wish-bar .back { min-width: 44px; }
.wish-entry .app-icon,.wish-intro .app-icon,.wish-empty .app-icon { width: 44px; height: 44px; }
.wish-entry .app-icon svg,.wish-intro .app-icon svg,.wish-empty .app-icon svg { width: 29px; height: 29px; }
.wish-form { padding: 20px; border: 1px solid var(--gift-line); border-radius: 18px 18px 5px 5px; background: var(--gift-bg); }
.wish-intro { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.wish-intro h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.wish-hint { color: var(--muted); font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; }
.wish-form fieldset { border: 0; min-width: 0; }
.wish-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.wish-form label,.wish-label { display: block; margin: 18px 0 8px; font-size: 13px; font-weight: 600; }
.wish-form .wish-label { margin-top: 0; }
.wish-form label .wish-hint { margin-left: 5px; font-weight: 400; }
.wish-form input,.wish-form select,.wish-form textarea { display: block; width: 100%; min-width: 0; max-width: 100%; min-height: 44px; border: 1px solid var(--gift-line); border-radius: 10px; padding: 10px; background: var(--bg); color: var(--text); font: inherit; font-size: 16px; }
.wish-form input::placeholder,.wish-form textarea::placeholder { color: var(--muted); opacity: 1; }
.wish-time-row { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 8px; align-items: center; }
