{% extends "auth.html" %}
{% block form %}
<h1>登录</h1>
<p class="lede">用你在这个团里的管理账号进入。</p>
{% for m in get_flashed_messages() %}<p class="flash" role="alert">{{ m }}</p>{% endfor %}
<label for="u">账号</label>
<input id="u" name="username" autocomplete="username" autofocus required>
<label for="p">密码</label>
<input id="p" type="password" name="password" autocomplete="current-password" required>
<button type="submit">进入控制台</button>
<details class="hint"><summary>忘了密码？</summary>
<p>管理员账号：请主账号到「账号」页帮你重置。</p>
<p>主账号：在装长日bot 的服务器上重设。Linux 在安装目录运行 <code>sudo ./changri reset-owner</code>；Windows 双击安装文件夹里的 <code>Reset-Owner-Password.bat</code>。新密码会显示出来，登录后在「账号」页改掉。</p>
</details>
{% endblock %}
