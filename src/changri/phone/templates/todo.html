{% extends 'base.html' %}
{% block title %}我的待回 · {{ brand }}{% endblock %}
{% block body %}
  <header class="bar"><a class="back" href="{{ url_for('discover') }}">发现</a><div class="title">我的待回</div></header>
  <div class="scroll list">
    {% for x in items %}<div style="padding:13px 20px;border-bottom:1px solid var(--line);line-height:1.6">{{ x }}</div>{% endfor %}
    {% if items %}<p style="padding:12px 20px;color:var(--mute);font-size:13px">加入申请、约会可以到「发现 → 邀约」处理；其他事回 QQ 群里用指令处理。</p>
    {% else %}<div class="empty">没有要回的事。</div>{% endif %}
  </div>
{% endblock %}
